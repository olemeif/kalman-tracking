[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kalman-tracking"
version = "0.1.0"
description = "A learning project on state estimation and target tracking."
requires-python = ">=3.13"
dependencies = ["numpy", "matplotlib"]

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["helpers"]
